<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Flower Rain Overlay */
        .flower-rain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .falling-flower {
            position: absolute;
            top: -50px;
            user-select: none;
            animation: flowerFall var(--fall-duration) linear infinite;
        }

        @keyframes flowerFall {
            0% {
                transform: translateY(-50px) rotate(0deg) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(1.2);
                opacity: 0.3;
            }
        }

        /* Smooth Screen Fade Overlay */
        .page-transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #ffd1dc, #e6e6fa, #ffefd5);
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
        }

        .page-transition-overlay.active {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="cursor"></div>
    <div class="container">
        <h1>Happy Birthday Saima💗</h1>
        <div class="greeting"></div>
        <button class="cta-button" id="magicBtn">Click to see a magic 💕</button>
    </div>

    <!-- Flower Rain Container -->
    <div class="flower-rain-container" id="flowerRain"></div>

    <!-- Fade Overlay -->
    <div class="page-transition-overlay" id="transitionOverlay"></div>

    <script src="script.js"></script>
    <script>
        document.getElementById('magicBtn').addEventListener('click', function () {
            startFlowerRain();

            // Fade screen smoothly
            setTimeout(() => {
                document.getElementById('transitionOverlay').classList.add('active');
            }, 1200);

            // Redirect to lock page
            setTimeout(() => {
                window.location.href = "lock.html";
            }, 2200);
        });

        function startFlowerRain() {
            const container = document.getElementById('flowerRain');
            const flowers = ['🌸', '🌺', '🌷', '🌹', '✨', '💖', '🌼'];

            for (let i = 0; i < 45; i++) {
                const flower = document.createElement('div');
                flower.classList.add('falling-flower');
                flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];

                flower.style.left = Math.random() * 100 + 'vw';
                flower.style.fontSize = (Math.random() * 1.5 + 1.2) + 'rem';

                const duration = Math.random() * 2 + 2;
                flower.style.setProperty('--fall-duration', duration + 's');
                flower.style.animationDelay = (Math.random() * 1) + 's';

                container.appendChild(flower);
            }
        }
    </script>
</body>
</html>
