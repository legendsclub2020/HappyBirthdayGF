<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open When... 💌</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;400;500;600&display=swap');

    :root {
      --bg-color: #fff0f3;
      --card-bg: #ffffff;
      --accent-color: #ff4d6d;
      --accent-hover: #ff758f;
      --text-color: #590d22;
      --border-radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffd1dc 0%, #e6e6fa 50%, #ffd1dc 100%);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .back-btn {
      align-self: flex-start;
      margin-bottom: 1.5rem;
      background: white;
      border: 2px solid #ffccd5;
      padding: 0.6rem 1.4rem;
      border-radius: 25px;
      color: var(--accent-color);
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(255, 77, 109, 0.15);
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: var(--accent-color);
      color: white;
      transform: translateY(-2px);
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 3rem;
      color: #ff4d6d;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    p.subtitle {
      font-size: 1.1rem;
      color: #800f2f;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .envelope-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 800px;
    }

    .envelope-card {
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #ffccd5;
      border-radius: var(--border-radius);
      padding: 1.8rem 1.5rem;
      text-align: center;
      box-shadow: 0 8px 20px rgba(255, 77, 109, 0.15);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }

    .envelope-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 25px rgba(255, 77, 109, 0.3);
    }

    .envelope-icon {
      font-size: 2.8rem;
    }

    .envelope-title {
      font-weight: 600;
      font-size: 1.1rem;
      color: #4a4a4a;
    }

    /* Modal Backdrop */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 1rem;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Modal Card */
    .modal-content {
      background: #ffffff;
      border-radius: var(--border-radius);
      max-width: 500px;
      width: 100%;
      padding: 2rem;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      position: relative;
      transform: scale(0.8);
      transition: transform 0.3s ease;
      text-align: center;
      border: 2px solid #ffd1dc;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-header {
      font-family: 'Dancing Script', cursive;
      font-size: 2.2rem;
      color: var(--accent-color);
      margin-bottom: 1rem;
    }

    .modal-body {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #4a4a4a;
      margin-bottom: 1.8rem;
      white-space: pre-line;
    }

    .close-btn {
      background: linear-gradient(45deg, #ff4d6d, #da70d6);
      color: white;
      border: none;
      padding: 0.7rem 1.8rem;
      font-size: 1rem;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(255, 77, 109, 0.3);
      transition: all 0.2s ease;
    }

    .close-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 77, 109, 0.5);
    }
  </style>
</head>
<body>

  <a href="last.html" class="back-btn">← Back</a>

  <h1>Open When... 💌</h1>
  <p class="subtitle">Pick an envelope whenever you feel like reading a little message.</p>

  <div class="envelope-grid">
    <div class="envelope-card" onclick="openLetter('missMe')">
      <div class="envelope-icon">📩</div>
      <div class="envelope-title">Open when you miss me</div>
    </div>

    <div class="envelope-card" onclick="openLetter('badDay')">
      <div class="envelope-icon">🌧️</div>
      <div class="envelope-title">Open when you're having a bad day</div>
    </div>

    <div class="envelope-card" onclick="openLetter('cantSleep')">
      <div class="envelope-icon">🌙</div>
      <div class="envelope-title">Open when you can't sleep</div>
    </div>

    <div class="envelope-card" onclick="openLetter('birthdayNight')">
      <div class="envelope-icon">🎂</div>
      <div class="envelope-title">Open on your birthday night</div>
    </div>
  </div>

  <!-- Modal Container -->
  <div class="modal-overlay" id="letterModal" onclick="closeOnOverlay(event)">
    <div class="modal-content">
      <div class="modal-header" id="modalTitle">Letter Title</div>
      <div class="modal-body" id="modalBody">Letter contents go here...</div>
      <button class="close-btn" onclick="closeLetter()">Close ❤️</button>
    </div>
  </div>

  <script>
    const letters = {
      missMe: {
        title: "When You Miss Me 💖",
        text: "Hey gorgeous! If you're reading this, just remember I'm probably daydreaming about you right now too. Send me a quick text—I’m always here for you!\n\nP.S. If missing me makes your heart beat faster, don't worry... that just means it's working properly. 😉💕"
      },
      badDay: {
        title: "When You're Having a Bad Day 🌷",
        text: "Take a deep breath, my love. Today might be tough, but you are so much tougher. You've got this, and whatever happened today won't define tomorrow.\n\nP.S. Even on your absolute worst day, you're still the prettiest girl in the universe and my absolute favorite person. 💫🥰"
      },
      cantSleep: {
        title: "When You Can't Sleep 💤",
        text: "Close those beautiful eyes and put your phone down. Imagine us cuddled up somewhere peaceful together. Sleep well, sweet girl.\n\nP.S. If you can't sleep, it's probably because you're busy running through my mind all night! 🌙✨"
      },
      birthdayNight: {
        title: "On Your Birthday Night 🎉",
        text: "I hope today was as special, stunning, and incredible as you are! Thank you for existing and making my whole world so much brighter. Happy Birthday, Saima!\n\nP.S. Out of all the gifts in the world, being yours is still my absolute favorite. 🎁💖"
      }
    };

    function openLetter(key) {
      const letter = letters[key];
      if (letter) {
        document.getElementById('modalTitle').innerText = letter.title;
        document.getElementById('modalBody').innerText = letter.text;
        document.getElementById('letterModal').classList.add('active');
      }
    }

    function closeLetter() {
      document.getElementById('letterModal').classList.remove('active');
    }

    function closeOnOverlay(event) {
      if (event.target === document.getElementById('letterModal')) {
        closeLetter();
      }
    }
  </script>
</body>
</html>
